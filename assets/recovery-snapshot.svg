<title id="title">FFTA recovery snapshot · 2026-10-20</title>
<desc id="desc">Resources: 9,247,442 bytes across 4,987 selected spans, 55.12 percent of ROM storage. Source assembly: 1,038,226 bytes across 4,187 modules, 6.19 percent of ROM storage. Both bars use the 16 MiB ROM as denominator. These are not completion percentages.</desc>
