name: Publish recovery atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html style.css app.js _site/
          cp -R assets data _site/
          python3 -m json.tool data/progress.json > /dev/null
          python3 -m json.tool data/systems.json > /dev/null
          python3 -m json.tool data/resource-addresses.json > /dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
