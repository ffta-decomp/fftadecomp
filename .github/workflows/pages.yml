name: Publish recovery atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          python3 tools/update_source_progress.py
          git diff --exit-code -- data/published-source-progress.json
          node --check app.js
          node tests/daily.test.cjs
          node tests/source-progress.test.cjs
          node tests/functions.test.cjs
          mkdir _site
          cp index.html style.css app.js contribute.html contribute.js _site/
          cp -R assets data _site/
          python3 tools/check_public_bundle.py
          node --check contribute.js
          python3 -m pip install --disable-pip-version-check -r tools/requirements-extract.txt
          git submodule update --init vendor/asm-differ
          python3 -m pip install --disable-pip-version-check -r tools/asmdiff-requirements.txt
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 -m json.tool data/progress.json > /dev/null
          python3 -m json.tool data/workflow.json > /dev/null
          python3 -m json.tool data/systems.json > /dev/null
          python3 -m json.tool data/submodules.json > /dev/null
          python3 -m json.tool data/resource-addresses.json > /dev/null
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
