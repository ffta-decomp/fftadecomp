name: Comment source hash results

on:
  workflow_run:
    workflows: [Build and verify source hashes]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.conclusion != 'skipped' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        id: report
        continue-on-error: true
        with:
          name: source-hash-summary
          path: ${{ runner.temp }}/source-hash-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/github-script@v8
        env:
          REPORT_PATH: ${{ runner.temp }}/source-hash-report/source-hash-summary.md
        with:
          script: |
            const publish = require('./.github/scripts/comment-source-hash-results.cjs');
            await publish({github, context, core, reportPath: process.env.REPORT_PATH});
