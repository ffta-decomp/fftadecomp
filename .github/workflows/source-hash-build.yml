name: Build and verify source hashes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make binutils-arm-none-eabi
          git submodule update --init vendor/agbcc
          python3 tools/bootstrap.py
      - name: Test verifier
        run: python3 -m unittest discover -s tests -p test_build_source_hashes.py
      - name: Build and verify selected source ranges
        run: python3 tools/build_source_hashes.py --jobs 4
