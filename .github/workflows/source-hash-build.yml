name: Build and verify source hashes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-hashes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make binutils-arm-none-eabi
          git submodule update --init vendor/agbcc
          python3 tools/bootstrap.py
      - name: Test verifier
        run: python3 -m unittest discover -s tests -p test_build_source_hashes.py
      - name: Build and verify selected source ranges
        env:
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
          IS_MAIN: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$IS_MAIN" = "true" ]; then
            python3 tools/build_source_hashes.py --jobs 4
          else
            git fetch --no-tags --depth=1 origin "$BASE_BRANCH"
            python3 tools/build_source_hashes.py --jobs 4 --base-ref FETCH_HEAD --summary "$GITHUB_STEP_SUMMARY"
          fi
